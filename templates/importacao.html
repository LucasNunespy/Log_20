
{% extends "base.html" %}

{% block title %}Importação de Dados - Log 20{% endblock %}

{% block content %}

<div class="importacao-header">
    <h2>Importação de Dados</h2>
    <p>Importe o arquivo operacional diário para o Log 20.</p>
</div>

<div class="importacao-container">

    <div class="importacao-box">

        <h3>Importar Arquivo CSV</h3>

        <form id="form-importacao"
              class="importacao-form"
              action="{{ url_for('importacao.pagina_importacao') }}"
              method="POST"
              enctype="multipart/form-data">

            <div class="importacao-campo">

                <label for="arquivo-csv">
                    Selecione o arquivo operacional
                </label>

                <input
                    type="file"
                    id="arquivo-csv"
                    name="arquivo"
                    accept=".csv"
                    required
                >

            </div>

            <button type="submit" class="importacao-botao">
                Importar Arquivo
            </button>

        </form>

        <p id="mensagem-importacao" class="importacao-mensagem"></p>

    </div>

</div>

{% endblock %}

{% block scripts %}
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/importacao.css') }}">
{% endblock %}
